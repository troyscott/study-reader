[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "study-reader"
version = "0.1.0"
description = "A mobile-first reader for source-grounded certification study material"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Troy Scott" }]
dependencies = [
  "fastapi>=0.116,<1",
  "jinja2>=3.1,<4",
  "markdown-it-py>=4,<5",
  "nh3>=0.3,<1",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2.12,<3",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/study_reader"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=study_reader --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["study_reader"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
